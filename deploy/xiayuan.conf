server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name xiayuanguide.cloud www.xiayuanguide.cloud;

    client_max_body_size 60m;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    location ~* ^/(assets|pages|docs)/.+\.(?:webp|avif|png|jpe?g|gif|svg|css|js)$ {
        root /opt/xiayuan;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* ^/(pages|docs)/.+\.html$ {
        root /opt/xiayuan;
        try_files $uri =404;
        expires 10m;
        add_header Cache-Control "public, max-age=600" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
    }

    ssl_certificate /etc/letsencrypt/live/xiayuanguide.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiayuanguide.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.xiayuanguide.cloud) {
        return 301 https://$host$request_uri;
    }

    if ($host = xiayuanguide.cloud) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name xiayuanguide.cloud www.xiayuanguide.cloud;
    return 404;
}
